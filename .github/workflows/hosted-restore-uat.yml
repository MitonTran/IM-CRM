name: Hosted restore UAT

on:
  workflow_dispatch:
    inputs:
      confirm_target_ref:
        description: "Nhập chính xác project ref disposable đã restore để chạy UAT"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-restore-uat
  cancel-in-progress: false

jobs:
  uat:
    if: inputs.confirm_target_ref == vars.RESTORE_DRILL_PROJECT_REF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FREE_BACKUP_PROJECT_REF: ${{ vars.FREE_BACKUP_PROJECT_REF }}
      RESTORE_DRILL_PROJECT_REF: ${{ vars.RESTORE_DRILL_PROJECT_REF }}
      RESTORE_DRILL_CONFIRM_PROJECT_REF: ${{ inputs.confirm_target_ref }}
      RESTORE_DRILL_DB_URL: ${{ secrets.RESTORE_DRILL_DB_URL }}
      RESTORE_DRILL_SUPABASE_URL: ${{ secrets.RESTORE_DRILL_SUPABASE_URL }}
      RESTORE_DRILL_SERVICE_ROLE_KEY: ${{ secrets.RESTORE_DRILL_SERVICE_ROLE_KEY }}
      RESTORE_DRILL_UAT_REPORT_PATH: test-results/hosted-restore-uat/report.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify five restored roles and RLS
        run: npm run restore:hosted:uat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-restore-uat-report
          path: ${{ env.RESTORE_DRILL_UAT_REPORT_PATH }}
          if-no-files-found: ignore
          retention-days: 14
