name: Preview smoke

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Vercel Preview origin, ví dụ https://im-crm-git-branch.vercel.app
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run smoke:deployment
        env:
          SMOKE_BASE_URL: ${{ inputs.preview_url }}
          SMOKE_REPORT_PATH: test-results/deployment-smoke.json
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - run: npx playwright install --with-deps chromium
      - run: npm run audit:preview-performance
        env:
          PERFORMANCE_BASE_URL: ${{ inputs.preview_url }}
          PERFORMANCE_REPORT_PATH: test-results/preview-performance.json
          PREVIEW_AUDIT_EMAIL: ${{ secrets.PREVIEW_AUDIT_EMAIL }}
          PREVIEW_AUDIT_PASSWORD: ${{ secrets.PREVIEW_AUDIT_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-verification
          path: |
            test-results/deployment-smoke.json
            test-results/preview-performance.json
          if-no-files-found: ignore
          retention-days: 14
